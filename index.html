<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }
        canvas {
            border: 2px solid #fff;
        }
        .score {
            position: absolute;
            top: 20px;
            color: #fff;
            font-size: 24px;
        }
        .player-score {
            left: 40%;
        }
        .ai-score {
            right: 40%;
        }
        .controls {
            position: absolute;
            bottom: 20px;
            color: #fff;
            text-align: center;
        }
        .player-name {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 16px;
        }
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: #222;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            color: #fff;
            border: 2px solid #fff;
        }
        .modal input {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #333;
            color: #fff;
        }
        .modal button {
            padding: 10px 20px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            background: #fff;
            color: #000;
            cursor: pointer;
        }
        .modal button:hover {
            background: #ccc;
        }
        .leaderboard {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #fff;
            min-width: 200px;
        }
        .leaderboard h3 {
            margin: 0 0 10px 0;
            text-align: center;
        }
        .leaderboard ol {
            margin: 0;
            padding-left: 20px;
        }
        .leaderboard li {
            margin: 5px 0;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <!-- Player Name Input Modal -->
    <div id="nameModal" class="modal">
        <div class="modal-content">
            <h2>Welcome to Pong!</h2>
            <p>Enter your name to start playing:</p>
            <input type="text" id="playerNameInput" placeholder="Your name" maxlength="20">
            <br>
            <button onclick="startGame()">Start Game</button>
        </div>
    </div>

    <!-- Game UI -->
    <div class="player-name">Player: <span id="playerName">Guest</span></div>
    <div class="score player-score"><span id="playerScore">0</span></div>
    <div class="score ai-score">AI: <span id="aiScore">0</span></div>
    
    <!-- Leaderboard -->
    <div class="leaderboard">
        <h3>🏆 Leaderboard</h3>
        <ol id="leaderboardList">
            <li>No scores yet</li>
        </ol>
    </div>

    <canvas id="gameCanvas" width="800" height="400" class="hidden"></canvas>
    <div class="controls hidden" id="gameControls">
        Controls: Arrow Keys ↑↓ or Mouse Wheel | Quit: ESC or Q | L: Show Leaderboard
    </div>
    <script src="pong.js"></script>
</body>
</html>
